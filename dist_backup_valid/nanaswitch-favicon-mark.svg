<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fond Squircle Bleu Nuit Profond pour icône mobile / onglet -->
    <radialGradient id="nsAppBg" cx="50" cy="48" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D2856" />
      <stop offset="65%" stop-color="#06142E" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>

    <filter id="nsShieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.5" />
    </filter>

    <filter id="nsInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.78" />
    </filter>

    <!-- Bordure extérieure métallique Gauche (Blanc Pur -> Cyan -> Bleu Royal) -->
    <linearGradient id="nsOuterLeft" x1="14" y1="8" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#7DD3FC" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Bordure extérieure métallique Droite (Bleu Royal -> Cyan -> Bleu Profond) -->
    <linearGradient id="nsOuterRight" x1="50" y1="8" x2="86" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Deuxième liseré interne lumineux du bouclier -->
    <linearGradient id="nsInnerRim" x1="20" y1="14" x2="80" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Fond Bleu Nuit Profond de la cavité du bouclier -->
    <radialGradient id="nsCoreBg" cx="50" cy="46" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B18" />
    </radialGradient>

    <!-- Dégradé Nuage Cloud Blanc Pur 3D -->
    <linearGradient id="nsCloudGrad" x1="30" y1="32" x2="72" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="78%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>

    <!-- Dégradé Flèche de Routage Cyan -> Bleu Royal (Gauche / Bas -> Centre) -->
    <linearGradient id="nsArrowCyanA" x1="33" y1="68" x2="52" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Dégradé Flèche de Routage Cyan -> Bleu Royal (Haut / Droite -> Centre) -->
    <linearGradient id="nsArrowCyanB" x1="66" y1="33" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Dégradé Flèche de Routage Blanc Pur (Bas -> Droite/Extérieur) -->
    <linearGradient id="nsArrowWhite" x1="37" y1="66" x2="60" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <clipPath id="nsShieldInnerClip">
      <path d="M50 16.5 L78.5 27.5 C78.5 53.5 68.5 73 50 84.5 C31.5 73 21.5 53.5 21.5 27.5 Z" />
    </clipPath>
  </defs>

  <!-- Écrin Squircle Sombre Haute-Visibilité -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#nsAppBg)" />

  <!-- 1. LE BOUCLIER PROTECTEUR À DOUBLE BORDURE MÉTALLIQUE & LUMINEUSE -->
  <g filter="url(#nsShieldGlow)">
    <path d="M50 7 L14 21.5 C14 53.5 26.5 77.5 50 93 L50 7 Z" fill="url(#nsOuterLeft)" />
    <path d="M50 7 L86 21.5 C86 53.5 73.5 77.5 50 93 L50 7 Z" fill="url(#nsOuterRight)" />
    <path d="M50 11.5 L81.8 24.2 C81.8 53.5 70.6 75.2 50 88.8 C29.4 75.2 18.2 53.5 18.2 24.2 Z" fill="#091938" />
    <path d="M50 13.5 L80.2 25.6 C80.2 53.5 69.5 74.2 50 86.8 C30.5 74.2 19.8 53.5 19.8 25.6 Z" fill="url(#nsInnerRim)" />
    <path d="M50 16.5 L78.5 27.5 C78.5 53.5 68.5 73 50 84.5 C31.5 73 21.5 53.5 21.5 27.5 Z" fill="url(#nsCoreBg)" />
  </g>

  <!-- 2. LE MAILLAGE RÉSEAU INTERNE (CONSTELLATION API) -->
  <g clip-path="url(#nsShieldInnerClip)" opacity="0.75">
    <g stroke="#38BDF8" stroke-width="0.95" stroke-opacity="0.58">
      <line x1="50" y1="22" x2="36" y2="27" />
      <line x1="50" y1="22" x2="64" y2="27" />
      <line x1="36" y1="27" x2="26" y2="32" />
      <line x1="64" y1="27" x2="74" y2="32" />
      <line x1="26" y1="32" x2="28" y2="48" />
      <line x1="74" y1="32" x2="72" y2="48" />
      <line x1="28" y1="48" x2="34" y2="62" />
      <line x1="72" y1="48" x2="66" y2="62" />
      <line x1="34" y1="62" x2="40" y2="71" />
      <line x1="66" y1="62" x2="60" y2="71" />
      <line x1="40" y1="71" x2="50" y2="78" />
      <line x1="60" y1="71" x2="50" y2="78" />
      <line x1="50" y1="22" x2="43" y2="34" />
      <line x1="50" y1="22" x2="57" y2="34" />
      <line x1="36" y1="27" x2="43" y2="34" />
      <line x1="64" y1="27" x2="57" y2="34" />
      <line x1="36" y1="27" x2="33" y2="38" />
      <line x1="64" y1="27" x2="67" y2="38" />
      <line x1="26" y1="32" x2="33" y2="38" />
      <line x1="74" y1="32" x2="67" y2="38" />
      <line x1="28" y1="48" x2="33" y2="38" />
      <line x1="72" y1="48" x2="67" y2="38" />
      <line x1="43" y1="34" x2="57" y2="34" />
      <line x1="34" y1="62" x2="50" y2="67" />
      <line x1="66" y1="62" x2="50" y2="67" />
      <line x1="50" y1="67" x2="40" y2="71" />
      <line x1="50" y1="67" x2="60" y2="71" />
      <line x1="50" y1="67" x2="50" y2="78" />
    </g>
    <g fill="#38BDF8">
      <circle cx="50" cy="22" r="1.9" fill="#7DD3FC" />
      <circle cx="36" cy="27" r="1.8" />
      <circle cx="64" cy="27" r="1.8" />
      <circle cx="26" cy="32" r="1.7" />
      <circle cx="74" cy="32" r="1.7" />
      <circle cx="43" cy="34" r="1.7" fill="#7DD3FC" />
      <circle cx="57" cy="34" r="1.7" fill="#7DD3FC" />
      <circle cx="33" cy="38" r="1.8" />
      <circle cx="67" cy="38" r="1.8" />
      <circle cx="28" cy="48" r="1.7" />
      <circle cx="72" cy="48" r="1.7" />
      <circle cx="34" cy="62" r="1.7" />
      <circle cx="66" cy="62" r="1.7" />
      <circle cx="50" cy="67" r="1.9" fill="#7DD3FC" />
      <circle cx="40" cy="71" r="1.6" />
      <circle cx="60" cy="71" r="1.6" />
      <circle cx="50" cy="78" r="1.8" />
    </g>
  </g>

  <!-- 3. LE CLOUD BLANC PUR & LES FLÈCHES COURBES DE ROUTAGE (SWITCH) -->
  <g filter="url(#nsInnerShadow)">
    <path
      d="M34.5 56.5 C29.8 56.5 26.5 53.1 26.5 48.6 C26.5 44.6 29.3 41.3 33.1 40.7 C34.2 36.2 38.2 33 43 33 C44.5 33 45.9 33.3 47.2 33.9 C49.5 30.2 53.6 28 58.2 28 C65.1 28 70.7 33.3 71.1 40.1 C75.3 41.1 78.3 44.8 78.3 49.2 C78.3 54.4 74.1 56.5 69.2 56.5 Z"
      fill="url(#nsCloudGrad)"
    />
    <path
      d="M55.5 32.5 C63.5 29.8 69.2 34.2 66.2 41.5 C64.2 46.2 59.8 50.2 55.2 52.8 L58.4 55.4 L46.8 54.2 L50.8 43.2 L53.2 46.5 C57.5 44.2 61.2 40.8 62.2 37.2 C63.0 34.4 60.0 33.0 55.5 32.5 Z"
      fill="url(#nsArrowCyanB)"
      stroke="#07142B"
      stroke-width="0.9"
      stroke-linejoin="round"
    />
    <path
      d="M35.5 67.8 C31.2 65.5 32.5 58.2 39.2 51.8 L36.2 48.8 L48.5 46.8 L45.2 57.8 L42.5 55.0 C37.6 59.8 36.2 64.5 38.2 66.8 Z"
      fill="url(#nsArrowCyanA)"
      stroke="#07142B"
      stroke-width="0.9"
      stroke-linejoin="round"
    />
    <path
      d="M36.8 66.2 C40.5 69.5 48.8 67.2 55.5 60.2 L58.2 62.6 L61.2 51.5 L50.0 54.4 L52.6 56.8 C47.2 62.0 41.0 64.2 37.8 63.0 Z"
      fill="url(#nsArrowWhite)"
      stroke="#07142B"
      stroke-width="0.8"
      stroke-linejoin="round"
    />
  </g>

  <!-- 4. ÉCLATS LUMINEUX SUR LES ARÊTES DU BOUCLIER -->
  <g transform="translate(15.5, 22)">
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    <path d="M-6 0 L6 0 M0 -6 L0 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" />
  </g>
  <g transform="translate(84.5, 22)">
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    <path d="M-6 0 L6 0 M0 -6 L0 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" />
  </g>
  <g transform="translate(24, 68)">
    <circle cx="0" cy="0" r="1.6" fill="#E0F2FE" />
    <path d="M-4.5 0 L4.5 0 M0 -4.5 L0 4.5" stroke="#E0F2FE" stroke-width="0.9" stroke-linecap="round" />
  </g>
  <g transform="translate(76, 68)">
    <circle cx="0" cy="0" r="1.6" fill="#E0F2FE" />
    <path d="M-4.5 0 L4.5 0 M0 -4.5 L0 4.5" stroke="#E0F2FE" stroke-width="0.9" stroke-linecap="round" />
  </g>
</svg>
