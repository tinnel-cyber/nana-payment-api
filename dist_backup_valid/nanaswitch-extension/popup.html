<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaNaSwitch Cloud — Smart Cloud API Router</title>
  <link rel="stylesheet" href="../nana-switch-extension/popup.css">
</head>
<body>
  <div class="app-container">
    <!-- En-tête officiel Bleu Royal & Blanc Pur avec l'Emblème Le Cœur de Routage -->
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon" style="background: transparent; padding: 0; width: 32px; height: 32px; box-shadow: none;">
          <svg viewBox="0 0 100 100" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 4 L 91 18 C 91 53 79 81 50 96 C 21 81 9 53 9 18 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
            <path d="M 50 9 L 86 21.5 C 86 52 75 76.5 50 90.5 C 25 76.5 14 52 14 21.5 Z" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1.5"/>
            <g stroke="#38BDF8" stroke-width="1" opacity="0.35">
              <line x1="50" y1="15" x2="26" y2="30" />
              <line x1="50" y1="15" x2="74" y2="30" />
              <line x1="26" y1="30" x2="28" y2="62" />
              <line x1="74" y1="30" x2="72" y2="62" />
            </g>
            <path d="M 31 59 H 68 C 74.5 59 79 54.5 79 48.5 C 79 43 75 38.5 69.5 38 C 68 29.5 60.5 23.5 51.5 23.5 C 43.5 23.5 36.8 28.2 34.2 35.2 C 28.2 35.8 23.5 40.8 23.5 47 C 23.5 53.6 26.8 59 31 59 Z" fill="#FFFFFF"/>
            <path d="M 22 65 C 36 74, 59 73, 76 53" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round"/>
            <polygon points="82,47 68,50 77,60" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <h1 class="logo-title">NaNa<span style="color: #7DD3FC;">Switch</span> <span style="font-size: 10px; background: rgba(255,255,255,0.18); padding: 1px 6px; border-radius: 6px; border: 1px solid rgba(125,211,252,0.4);">CLOUD</span></h1>
          <span class="logo-subtitle">Smart API Router • Le Cœur de Routage</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="extLockBtn" class="lock-icon-btn" title="Verrouiller l'extension (Code PIN)">
          🔒
        </button>
        <a href="https://pos-app-1759a.web.app/nana-switch/app" target="_blank" rel="noopener" class="pocket-link-pill" title="Ouvrir NaNaSwitch Cloud Mobile">
          📱 Mobile
        </a>
      </div>
    </header>

    <!-- ÉCRAN DE VERROUILLAGE SÉCURISÉ PIN DE L'EXTENSION -->
    <div id="extLockScreen" class="ext-lock-screen" style="display: none;">
      <div class="lock-card">
        <div class="lock-icon-badge" style="background: transparent; border: none; box-shadow: none; width: 54px; height: 54px; margin: 0 auto 6px;">
          <svg viewBox="0 0 100 100" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 4 L 91 18 C 91 53 79 81 50 96 C 21 81 9 53 9 18 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
            <path d="M 50 9 L 86 21.5 C 86 52 75 76.5 50 90.5 C 25 76.5 14 52 14 21.5 Z" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1.5"/>
            <path d="M 31 59 H 68 C 74.5 59 79 54.5 79 48.5 C 79 43 75 38.5 69.5 38 C 68 29.5 60.5 23.5 51.5 23.5 C 43.5 23.5 36.8 28.2 34.2 35.2 C 28.2 35.8 23.5 40.8 23.5 47 C 23.5 53.6 26.8 59 31 59 Z" fill="#FFFFFF"/>
            <path d="M 22 65 C 36 74, 59 73, 76 53" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round"/>
            <polygon points="82,47 68,50 77,60" fill="#FFFFFF"/>
          </svg>
        </div>
        <h2 class="lock-title" id="extLockTitle">NaNaSwitch Cloud Sécurisé</h2>
        <p class="lock-desc" id="extLockDesc">Entrez votre Code PIN à 4 chiffres</p>

        <!-- Indicateurs 4 cercles -->
        <div class="pin-dots-container">
          <span class="pin-dot" id="extDot0"></span>
          <span class="pin-dot" id="extDot1"></span>
          <span class="pin-dot" id="extDot2"></span>
          <span class="pin-dot" id="extDot3"></span>
        </div>

        <div id="extPinError" class="pin-error-msg" style="display: none;"></div>

        <!-- Pavé tactile -->
        <div class="pin-keypad">
          <button type="button" class="pin-key" data-digit="1">1</button>
          <button type="button" class="pin-key" data-digit="2">2</button>
          <button type="button" class="pin-key" data-digit="3">3</button>
          <button type="button" class="pin-key" data-digit="4">4</button>
          <button type="button" class="pin-key" data-digit="5">5</button>
          <button type="button" class="pin-key" data-digit="6">6</button>
          <button type="button" class="pin-key" data-digit="7">7</button>
          <button type="button" class="pin-key" data-digit="8">8</button>
          <button type="button" class="pin-key" data-digit="9">9</button>
          <button type="button" class="pin-key pin-clear" id="extPinClear">C</button>
          <button type="button" class="pin-key" data-digit="0">0</button>
          <button type="button" class="pin-key pin-del" id="extPinDel">⌫</button>
        </div>

        <div class="lock-footer">
          <span class="lock-sec-tag">🛡️ Protection Zero-Trust SHA-256</span>
        </div>
      </div>
    </div>

    <!-- Navigation par Onglets -->
    <nav class="tabs-nav">
      <button type="button" class="tab-btn active" data-tab="routerTab">
        <span>⚡ Caisse</span>
      </button>
      <button type="button" class="tab-btn" data-tab="quickswitchTab">
        <span>🔀 Quick-Switch</span>
      </button>
      <button type="button" class="tab-btn" data-tab="pingTab">
        <span>📡 Flux Live</span>
      </button>
      <button type="button" class="tab-btn" data-tab="connectTab">
        <span>🔑 Clé & Code</span>
      </button>
    </nav>

    <main class="tabs-content">
      <section class="tab-pane active" id="routerTab">
        <div class="card">
          <div class="card-title flex-between">
            <span>⚡ Caisse & Routeur Multi-Pays</span>
            <span class="badge-pill">Failover 0ms</span>
          </div>
          <div class="form-row">
            <div class="form-group half">
              <label for="amountInput">Montant :</label>
              <input type="number" id="amountInput" value="15000" step="500" />
            </div>
            <div class="form-group half">
              <label for="countrySelect">Zone Pays :</label>
              <select id="countrySelect" class="form-select">
                <option value="BF">🇧🇫 Burkina Faso</option>
                <option value="CI">🇨🇮 Côte d’Ivoire</option>
                <option value="SN">🇸🇳 Sénégal</option>
                <option value="ML">🇲🇱 Mali</option>
                <option value="BJ">🇧🇯 Bénin</option>
                <option value="TG">🇹🇬 Togo</option>
                <option value="CM">🇨🇲 Cameroun</option>
                <option value="INT">🌍 Cartes 3DS</option>
              </select>
            </div>
          </div>
          <button type="button" id="generateRouteBtn" class="btn btn-primary">
            <span>🚀 Générer la Route Sécurisée</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Zero-Trust Sandbox • NaNaSwitch Cloud Node</span>
      <a href="https://pos-app-1759a.web.app/nana-switch/app" target="_blank" rel="noopener" class="footer-link">NaNaSwitch Cloud Mobile &rarr;</a>
    </footer>
  </div>
  <script src="../nana-switch-extension/popup.js"></script>
</body>
</html>
