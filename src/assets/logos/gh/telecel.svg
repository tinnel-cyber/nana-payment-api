<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Telecel Cash Ghana (GH • Telecel) - Official Sebpay Vector Emblem (100% Transparent Background) -->
  <g id="telecel-gh">
    <rect x="4" y="4" width="112" height="112" rx="24" fill="#ffffff" fill-opacity="0.96" stroke="#e2e8f0" stroke-width="1.5"/>
    
        <g transform="translate(60, 42)">
          <circle cx="0" cy="0" r="22" fill="#e30613"/>
          <path d="M -12 -8 L 12 -8 M 0 -8 L 0 12" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        </g>
      
    <text x="60" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#e30613" text-anchor="middle">telecel<tspan fill="#1e293b"> cash</tspan></text>
    <g transform="translate(24, 85)">
      <rect x="0" y="0" width="72" height="18" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      
    <g transform="translate(4.5, 4.5)">
      <clipPath id="flag-gh-telecel-flapr">
        <circle cx="4.5" cy="4.5" r="4.5"/>
      </clipPath>
      <g clip-path="url(#flag-gh-telecel-flapr)">
        <rect x="0" y="0" width="9" height="3" fill="#dc2626"/><rect x="0" y="3" width="9" height="3" fill="#facc15"/><rect x="0" y="6" width="9" height="3" fill="#16a34a"/><circle cx="4.5" cy="4.5" r="1.1" fill="#000000"/>
      </g>
    </g>
  
      <text x="41" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#991b1b" text-anchor="middle" letter-spacing="0.3">
        GH • Telecel
      </text>
    </g>
  </g>
</svg>