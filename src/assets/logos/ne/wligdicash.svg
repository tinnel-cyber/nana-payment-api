<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- LigdiCash Official Vector Emblem -->
  <defs>
    <linearGradient id="ligdiGreen-ne" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="ligdiOrangeRed-ne" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="ligdiGold-ne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- White Oval Badge Background -->
  <ellipse cx="60" cy="60" rx="54" ry="38" fill="#ffffff"/>

  <!-- Top Green Arc Border -->
  <path d="M 8 60 A 52 36 0 0 1 112 60" stroke="url(#ligdiGreen-ne)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Bottom Orange/Red Arc Border -->
  <path d="M 112 60 A 52 36 0 0 1 8 60" stroke="url(#ligdiOrangeRed-ne)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Handshake Icon in Golden Orange -->
  <g transform="translate(60, 44)">
    <!-- Left Sleeve Cuff -->
    <rect x="-24" y="-10" width="5.5" height="20" rx="1.5" fill="url(#ligdiGold-ne)"/>
    <!-- Right Sleeve Cuff -->
    <rect x="18.5" y="-10" width="5.5" height="20" rx="1.5" fill="url(#ligdiGold-ne)"/>

    <!-- Handshake Silhouette Clasp -->
    <path d="M -18.5 -4.5 L -6 -4.5 L -1.5 -1.5 L -5 4.5 L -18.5 4.5 Z" fill="url(#ligdiGold-ne)"/>
    <path d="M 18.5 -4.5 L 6 -4.5 L 1.5 -1.5 L 5 4.5 L 18.5 4.5 Z" fill="url(#ligdiGold-ne)"/>
    
    <!-- Interlocking Hands Detail -->
    <path d="M -5 -5 C 0 -7, 3 -7, 6 -4 L 1 -0.5 L -4 -0.5 Z" fill="url(#ligdiGold-ne)"/>
    <path d="M -4 0 L 2 5 L -1 7.5 L -6 2.5 Z" fill="#b45309"/>
    <path d="M -1 1.5 L 5 6.5 L 2 9 L -3 4 Z" fill="url(#ligdiGold-ne)"/>
    <path d="M 2 3 L 8 8 L 5 10.5 L 0 5.5 Z" fill="#b45309"/>
    <path d="M 5 4.5 L 10 9 L 8 11.5 L 3 7 Z" fill="url(#ligdiGold-ne)"/>

    <!-- Outer Handshake Accent Strokes -->
    <path d="M -14 -6.5 C -9 -7.5, -4 -6.5, 0 -3.5 C 4 -6.5, 9 -7.5, 14 -6.5" stroke="url(#ligdiGold-ne)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M -14 6.5 C -9 7.5, -4 6.5, 0 3.5 C 4 6.5, 9 7.5, 14 6.5" stroke="url(#ligdiGold-ne)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark "LigdiCash" -->
  <text x="60" y="79"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="16"
    font-weight="900"
    fill="#15803d"
    text-anchor="middle"
    letter-spacing="-0.3">LigdiCash</text>
</svg>