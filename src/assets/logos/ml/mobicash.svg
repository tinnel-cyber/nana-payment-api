<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Mobicash Malitel (ML • Malitel) - Official Sebpay Vector Emblem (100% Transparent Background) -->
  <g id="mobicash-ml">
    <rect x="4" y="4" width="112" height="112" rx="24" fill="#ffffff" fill-opacity="0.96" stroke="#e2e8f0" stroke-width="1.5"/>
    
        <g transform="translate(60, 42)">
          <circle cx="0" cy="0" r="22" fill="#005a9c"/>
          <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#f37021" text-anchor="middle">M</text>
        </g>
      
    <text x="60" y="75" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#005a9c" text-anchor="middle">mobi<tspan fill="#f37021">cash</tspan></text>
    <g transform="translate(24, 85)">
      <rect x="0" y="0" width="72" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      
    <g transform="translate(4.5, 4.5)">
      <clipPath id="flag-ml-mobicash-wh5je">
        <circle cx="4.5" cy="4.5" r="4.5"/>
      </clipPath>
      <g clip-path="url(#flag-ml-mobicash-wh5je)">
        <rect x="0" y="0" width="3" height="9" fill="#16a34a"/><rect x="3" y="0" width="3" height="9" fill="#facc15"/><rect x="6" y="0" width="3" height="9" fill="#dc2626"/>
      </g>
    </g>
  
      <text x="41" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#1e40af" text-anchor="middle" letter-spacing="0.3">
        ML • Malitel
      </text>
    </g>
  </g>
</svg>