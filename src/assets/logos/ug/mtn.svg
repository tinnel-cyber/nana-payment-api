        <rect x="0" y="0" width="9" height="1.5" fill="#000000"/><rect x="0" y="1.5" width="9" height="1.5" fill="#facc15"/><rect x="0" y="3" width="9" height="1.5" fill="#dc2626"/><rect x="0" y="4.5" width="9" height="1.5" fill="#000000"/><rect x="0" y="6" width="9" height="1.5" fill="#facc15"/><rect x="0" y="7.5" width="9" height="1.5" fill="#dc2626"/>
      </g>
    </g>
  
      <text x="41" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#854d0e" text-anchor="middle" letter-spacing="0.3">
