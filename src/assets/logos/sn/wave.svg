<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Wave Official 3D Penguin Emblem -->
  <defs>
    <radialGradient id="waveCircleBg-sn" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#24b6ff"/>
      <stop offset="100%" stop-color="#0088e8"/>
    </radialGradient>
    <linearGradient id="wavePenguinBody-sn" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#32363b"/>
      <stop offset="30%" stop-color="#1e2023"/>
      <stop offset="100%" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="wavePenguinBelly-sn" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="waveOrange-sn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="waveTextDrop-sn" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#005899" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Blue Circle Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#waveCircleBg-sn)"/>

  <!-- 3D Penguin -->
  <g transform="translate(60, 48)">
    <ellipse cx="0" cy="27" rx="18" ry="4" fill="#0069b4" opacity="0.4"/>
    <path d="M -15 -4 C -23 -11, -27 -17, -28 -11 C -29 -6, -23 2, -13 6 Z" fill="url(#wavePenguinBody-sn)"/>
    <path d="M 15 -4 C 21 1, 24 10, 22 16 C 20 15, 17 10, 14 4 Z" fill="url(#wavePenguinBody-sn)"/>
    <ellipse cx="0" cy="0" rx="18" ry="24" fill="url(#wavePenguinBody-sn)"/>
    <ellipse cx="-8" cy="25" rx="6" ry="4" fill="url(#waveOrange-sn)"/>
    <ellipse cx="8" cy="25" rx="6" ry="4" fill="url(#waveOrange-sn)"/>
    <ellipse cx="0" cy="5" rx="11" ry="15" fill="url(#wavePenguinBelly-sn)"/>
    <circle cx="-5.5" cy="-9" r="2.8" fill="#ffffff"/>
    <circle cx="-5.5" cy="-9" r="1.4" fill="#1e2023"/>
    <circle cx="-6.2" cy="-9.7" r="0.6" fill="#ffffff"/>
    <circle cx="5.5" cy="-9" r="2.8" fill="#ffffff"/>
    <circle cx="5.5" cy="-9" r="1.4" fill="#1e2023"/>
    <circle cx="4.8" cy="-9.7" r="0.6" fill="#ffffff"/>
    <path d="M -5 -5 C -2.5 -8, 2.5 -8, 5 -5 C 3.5 -0.5, -3.5 -0.5, -5 -5 Z" fill="url(#waveOrange-sn)"/>
    <ellipse cx="0" cy="-3.5" rx="4" ry="2.2" fill="url(#waveOrange-sn)"/>
  </g>

  <!-- Wordmark "wave" -->
  <text x="60" y="99"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-0.5"
    filter="url(#waveTextDrop-sn)">wave</text>
</svg>