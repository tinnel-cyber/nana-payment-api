          <rect x="8" y="-14" width="14" height="14" rx="4" fill="#e11900"/>
          <text x="15" y="-4" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>
